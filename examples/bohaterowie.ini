; Custom Heroes (WlasniBohaterowie) - configuration
; Written by the Hero Creator (Kreator.exe) - easiest to edit it there.
;
; Keys: id, szkola (school: ziemia/ogien/woda/powietrze), bonus (%),
;   umiejetnosci (skill:level 1-3), czary (spell numbers), statystyki (A/D/P/K),
;   specjalizacja (wlasna = own / brak = none / hero number to copy from),
;   nazwa_specjalizacji, opis_specjalizacji (in-game specialty name and description),
;   ikona (wlasna = own / skill name = skill icon / hero number = that hero's icon; absent = automatic).
; Changes take effect after restarting the game (skills/spells/stats: in a NEW game).

; Example: Vehr becomes an Earth Magic specialist, like Adrienne is for Fire Magic.
