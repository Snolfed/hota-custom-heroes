; Custom Heroes (WlasniBohaterowie) - configuration
; Written by the Hero Creator (Kreator.exe) - easiest to edit it there.
;
; Keys: id, imie (new name, max 12), szkola (school: ziemia/ogien/woda/powietrze), bonus (%),
;   umiejetnosci (skill:level 1-3), czary (spell numbers, brak = no starting spell), statystyki (A/D/P/K),
;   armia (starting army: creature:count or creature:min-max, up to 7, comma separated),
;   specjalizacja (wlasna = own / brak = none / hero number to copy from),
;   specjalizacja_typ (stwor / stwor_poziom / czar / umiejetnosc / surowiec / szybkosc) with
;   stwor (creature number) + stwor_atak, stwor_obrona, stwor_obrazenia, stwor_szybkosc,
;   spec_czar (spell number), spec_umiejetnosc (skill), spec_surowiec (0-6, 6 = gold),
;   ksiega (tak / nie: spell book at start),
;   nazwa_specjalizacji, opis_specjalizacji (in-game specialty name and description),
;   ikona (wlasna = own / skill name = skill icon / hero number = that hero's icon; absent = automatic).
; Changes take effect after restarting the game (skills/spells/army/stats: in a NEW game).

; Example: Vehr becomes an Earth Magic specialist, like Adrienne is for Fire Magic.
[Bohater1]
; Vehr
id = 212
specjalizacja = brak
szkola = ziemia
bonus = 50
umiejetnosci = magiaziemi:3
czary = 18   ; Implosion
statystyki = 0/0/2/3

; Example: Adela gets a Prayer specialty, Prayer instead of Bless, and a stronger Castle army.
[Bohater2]
; Adela
id = 9
specjalizacja_typ = czar
spec_czar = 48   ; Prayer
czary = 48   ; Prayer
armia = 1:10-20, 3:4-7, 13:1-2   ; Halberdiers, Marksmen, Archangels