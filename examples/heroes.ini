; HeroForge - hero configuration
; Written by the HeroForge editor (HeroForge.exe) - easiest to edit it there.
;
; Keys: id, name (new name, max 12), school (earth / fire / water / air), bonus (%),
;   skills (skill:level 1-3), spells (spell numbers, none = no starting spell), stats (A/D/P/K),
;   army (starting army: creature:count or creature:min-max, up to 7, comma separated),
;   specialty (own / none / hero number to copy from),
;   specialty_type (creature / creature_level / spell / skill / resource / speed) with
;   creature (creature number) + creature_attack, creature_defense, creature_damage, creature_speed,
;   specialty_spell (spell number), specialty_skill (skill), specialty_resource (0-6, 6 = gold),
;   spellbook (yes / no: spell book at start),
;   specialty_name, specialty_description (in-game specialty name and description),
;   icon (own / skill name = skill icon / hero number = that hero's icon; absent = automatic).
; Changes take effect after restarting the game (skills/spells/army/stats: in a NEW game).

; Example: Vehr becomes an Earth Magic specialist, like Adrienne is for Fire Magic.
[Hero1]
; Vehr
id = 212
specialty = none
school = earth
bonus = 50
skills = Earth Magic:3
spells = 18   ; Implosion
stats = 0/0/2/3

; Example: Adela gets a Prayer specialty, Prayer instead of Bless, and a stronger Castle army.
[Hero2]
; Adela
id = 9
specialty_type = spell
specialty_spell = 48   ; Prayer
spells = 48   ; Prayer
army = 1:10-20, 3:4-7, 13:1-2   ; Halberdiers, Marksmen, Archangels

; Example: Ergon specializes in Jotunns, growing with his level like Creyle with Mammoths.
[Hero3]
; Ergon
id = 205
specialty_type = creature_level
creature = 198   ; Jotunns / Jotunn Warlords